<!DOCTYPE html>
<html lang="cs">
<head>

            background-image: url('https://cdn.discordapp.com/attachments/775254884877467658/1439645450297806938/content.png?ex=691b45ce&is=6919f44e&hm=3b12fff1b22bfd085f2773dc41ec96f3bd96cf489c3607c8c60d6abe416d5172&');

            background-position: center; 
            background-repeat: no-repeat; 
        }

        
        .content {
            display: flex;

            align-items: center;
            height: 100%;
            color: white;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.4);
        }

     
        h1 {
            font-size: clamp(1.5rem, 5vw, 3rem);
